<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rGrad" x1="0" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff33bb"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="100" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#33f5ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <rect x="50" y="50" width="400" height="400" rx="30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <g stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round">
    <line x1="75" y1="50" x2="75" y2="90" stroke="#ff00aa" filter="url(#glowMagenta)"/>
    <line x1="50" y1="75" x2="90" y2="75" stroke="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="425" y1="50" x2="425" y2="90" stroke="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="410" y1="75" x2="450" y2="75" stroke="#ff00aa" filter="url(#glowMagenta)"/>
    <line x1="75" y1="450" x2="75" y2="410" stroke="#00f0ff" filter="url(#glowCyan)"/>
    <line x1="50" y1="425" x2="90" y2="425" stroke="#ff00aa" filter="url(#glowMagenta)"/>
    <line x1="425" y1="450" x2="425" y2="410" stroke="#ff00aa" filter="url(#glowMagenta)"/>
    <line x1="410" y1="425" x2="450" y2="425" stroke="#00f0ff" filter="url(#glowCyan)"/>
  </g>

  <polygon points="250,120 310,250 250,380 190,250" fill="none" stroke="rgba(255,204,0,0.15)" stroke-width="1.5"/>

  <text x="170" y="310" font-family="'Space Grotesk','Inter',sans-serif" font-size="240" font-weight="700" fill="url(#rGrad)" filter="url(#glowMagenta)" text-anchor="middle">R</text>

  <text x="330" y="310" font-family="'Space Grotesk','Inter',sans-serif" font-size="240" font-weight="700" fill="url(#sGrad)" filter="url(#glowCyan)" text-anchor="middle">S</text>

  <circle cx="250" cy="120" r="4" fill="#ffcc00" filter="url(#glowYellow)"/>
  <circle cx="250" cy="380" r="4" fill="#ffcc00" filter="url(#glowYellow)"/>
  <circle cx="190" cy="250" r="3" fill="#ffcc00" filter="url(#glowYellow)"/>
  <circle cx="310" cy="250" r="3" fill="#ffcc00" filter="url(#glowYellow)"/>
</svg>